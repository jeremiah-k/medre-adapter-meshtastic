[project]
name = "medre-adapter-meshtastic"
version = "0.1.0"
description = "meshtastic transport adapter for MEDRE"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["medre>=0.1.0", 'mtjk==2.7.11.post10', 'PyPubSub==4.0.7']

[project.entry-points."medre.adapters"]
meshtastic = "medre.adapters.meshtastic.plugin:adapter_spec"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
